name: Deploy

# Every push to main that passes lint + typecheck is built here and the
# static bundle shipped to the server. The server never builds: it has no
# Node, no repo, and no build step that could half-finish and leave the
# site broken.
on:
  push:
    branches: [main]
  # Manual re-deploy without an empty commit — useful after changing a
  # secret, or to roll forward after a failed run.
  workflow_dispatch:

# A newer push supersedes an in-flight deploy, but never cancels one
# mid-upload: cancel-in-progress would risk leaving a partial bundle on
# the server.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # Only after the quality gates pass. A red build must never ship.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # VITE_* values are inlined at BUILD time, not read at runtime — so
      # the production API URL has to exist here, not on the server.
      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::VITE_API_URL repository variable is not set."
            exit 1
          fi
          npm run build

      - name: Add the server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Load the deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # Upload to a staging directory first, then swap it in with a single
      # mv. A direct rsync into the live root serves a half-written bundle
      # for the duration of the transfer — index.html can reference an
      # asset hash that has not landed yet.
      - name: Upload
        run: |
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=yes" \
            dist/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}.incoming/"

      - name: Swap into place
        run: |
          ssh -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -e
             TARGET='${{ secrets.DEPLOY_PATH }}'
             rm -rf \"\$TARGET.previous\"
             [ -d \"\$TARGET\" ] && mv \"\$TARGET\" \"\$TARGET.previous\"
             mv \"\$TARGET.incoming\" \"\$TARGET\""

      - name: Verify it is serving
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${{ vars.DEPLOY_URL }}")
          echo "GET ${{ vars.DEPLOY_URL }} -> $code"
          [ "$code" = "200" ] || { echo "::error::Site did not return 200."; exit 1; }
