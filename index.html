<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Never leak an admin URL (which can carry record ids) to third parties. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Internal console: never embeddable, and no search indexing. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Gasa Admin Platform</title>
    <script>
      // Runs before first paint to avoid a flash of the wrong theme. The
      // storage key is namespaced per portal so both apps can share a host.
      (function () {
        try {
          var stored = localStorage.getItem("gasa-admin-theme");
          var theme =
            stored === "gasa" || stored === "gasadark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "gasadark"
                : "gasa";
          document.documentElement.classList.toggle("dark", theme === "gasadark");
        } catch (e) {
          // Leave the light (no .dark class) default in place.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
